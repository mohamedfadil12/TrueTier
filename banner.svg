<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="TrueTier: three suppliers that look independent all depend on one wafer fab and one port" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0D"/><stop offset="1" stop-color="#10151C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4D4D" stop-opacity="0.55"/><stop offset="1" stop-color="#FF4D4D" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#E8ECF1}
      .m{font-family:Consolas,Menlo,monospace;fill:#8A94A3;font-size:13px}
      .flow{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
    </style>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g stroke="#1B222C" stroke-width="1">
    <path d="M0 105H1200M0 210H1200M0 315H1200M300 0V420M600 0V420M900 0V420"/>
  </g>

  <!-- title -->
  <text x="60" y="110" class="t" font-size="64" font-weight="700">TrueTier</text>
  <text x="62" y="148" class="t" font-size="20" fill="#C9D1DB">Independence isn't how many suppliers you have.</text>
  <text x="62" y="176" class="t" font-size="20" fill="#C9D1DB">It's how many don't share a failure.</text>
  <text x="62" y="222" class="m">SUPPLY CHAIN MANAGEMENT  ·  METAVERSE 2.0  ·  THE SUPPLIER ILLUSION</text>

  <!-- legend -->
  <g font-size="13" class="m">
    <line x1="62" y1="300" x2="102" y2="300" stroke="#2DD4BF" stroke-width="3"/><text x="112" y="305">verified</text>
    <line x1="200" y1="300" x2="240" y2="300" stroke="#F5B942" stroke-width="3" stroke-dasharray="10 6"/><text x="250" y="305">reported</text>
    <line x1="340" y1="300" x2="380" y2="300" stroke="#A78BFA" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><text x="390" y="305">inferred</text>
  </g>

  <!-- graph: tier-1 suppliers -->
  <g class="t" font-size="14">
    <circle cx="640" cy="110" r="16" fill="#12303A" stroke="#2DD4BF" stroke-width="2"/><text x="610" y="90" fill="#E8ECF1">Nexa Semi</text>
    <circle cx="640" cy="210" r="16" fill="#12303A" stroke="#F5B942" stroke-width="2"/><text x="610" y="190" fill="#E8ECF1">Orion Micro</text>
    <circle cx="640" cy="310" r="16" fill="#12303A" stroke="#A78BFA" stroke-width="2"/><text x="610" y="290" fill="#E8ECF1">Helix Devices</text>
  </g>

  <!-- tier-2 fab with pulsing halo -->
  <circle cx="830" cy="210" r="60" fill="url(#halo)">
    <animate attributeName="r" values="44;66;44" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="210" r="22" fill="#3A1418" stroke="#FF4D4D" stroke-width="3"/>
  <text x="790" y="262" class="t" font-size="14">Hsinchu Wafer Works</text>

  <!-- port -->
  <rect x="978" y="190" width="40" height="40" rx="8" fill="#3A1418" stroke="#FF4D4D" stroke-width="3"/>
  <text x="950" y="255" class="t" font-size="14">Port of Kaohsiung</text>

  <!-- buyer -->
  <rect x="1100" y="190" width="56" height="40" rx="8" fill="#10151C" stroke="#E8ECF1" stroke-width="2"/>
  <text x="1104" y="256" class="t" font-size="14">Aurora</text>

  <!-- edges (animated flow toward buyer) -->
  <g fill="none" stroke-width="3">
    <path d="M656 110 C 730 110, 740 210, 808 210" stroke="#2DD4BF" class="flow"/>
    <path d="M656 210 L 808 210" stroke="#F5B942" stroke-dasharray="10 6" class="flow"/>
    <path d="M656 310 C 730 310, 740 210, 808 210" stroke="#A78BFA" stroke-linecap="round" class="flow"/>
    <path d="M852 210 L 978 210" stroke="#FF4D4D" class="flow"/>
    <path d="M1018 210 L 1100 210" stroke="#FF4D4D" class="flow"/>
  </g>
  <text x="640" y="380" class="m" font-size="13">3 suppliers  →  1 fab  →  1 port  →  1 point of failure</text>
</svg>
